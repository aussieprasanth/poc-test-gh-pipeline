trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

steps:
  - task: Cache@2
    displayName: Cache Maven packages
    inputs:
      key: 'maven | "$(Agent.OS)" | pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
      path: $(MAVEN_CACHE_FOLDER)

  # JaCoCo 0.8.2 in pom.xml supports up to Java 11; source/target remain 1.8.
  - task: Maven@4
    displayName: Build, test and package
    inputs:
      mavenPomFile: pom.xml
      goals: clean verify
      options: '-B'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: JDKVersion
      jdkVersionOption: '1.11'
      mavenOptions: '$(MAVEN_OPTS)'
      # The POM owns JaCoCo; task injection would duplicate its plugin.
      codeCoverageToolOption: None

  - task: PublishCodeCoverageResults@2
    displayName: Publish JaCoCo coverage
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: $(System.DefaultWorkingDirectory)/target/site/jacoco/jacoco.xml
      pathToSources: $(System.DefaultWorkingDirectory)/src/main/java
      failIfCoverageEmpty: false

  - task: CopyFiles@2
    displayName: Stage WAR file
    inputs:
      SourceFolder: $(System.DefaultWorkingDirectory)/target
      Contents: '*.war'
      TargetFolder: $(Build.ArtifactStagingDirectory)

  - task: PublishBuildArtifacts@1
    displayName: Publish WAR artifact
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)
      ArtifactName: drop
      publishLocation: Container
