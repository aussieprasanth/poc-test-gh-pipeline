# Source: azure-pipelines.yml (retained unchanged).
# CI-only migration; not a claim of full reporting/provider parity.
# ADO definition/UI evidence is still needed for the effective repository provider,
# branch policies, trigger overrides/UI schedules, checkout depth/tags/clean, and
# retention. The checkout below uses modern shallow-checkout defaults, NOT verified
# effective settings for this ADO definition.
# Raw JUnit and JaCoCo artifacts below do not reproduce Azure test/coverage tabs,
# annotations, history, coverage conversion, or source-linked coverage rendering.
# These reporting gaps block full-scope acceptance; no new quality gate is added.
# Manual dispatch requires this workflow on GitHub's default branch and write
# access; callers can select a ref. No queue-time parameters exist in source YAML;
# UI-defined queue-time variable overrides remain unknown and are not invented.
name: Maven CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# ADO YAML PR autoCancel defaults to true for providers supporting YAML PR triggers.
# Azure Repos instead requires branch-policy evidence, which is not available.
# Only PRs share a cancellable group; push/manual runs each have a unique group.
concurrency:
  group: maven-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest
    # ADO's documented default job execution timeout; not an approval timeout.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: false
          clean: true
          lfs: false
          submodules: false

      # Required adapter: runner context is unavailable in workflow/job env.
      # Initialize both values here rather than referencing sibling env entries.
      - name: Initialize Maven repository location
        run: |
          printf 'MAVEN_CACHE_FOLDER=%s/.m2/repository\n' "$RUNNER_WORKSPACE" >> "$GITHUB_ENV"
          printf 'MAVEN_OPTS=-Dmaven.repo.local=%s/.m2/repository\n' "$RUNNER_WORKSPACE" >> "$GITHUB_ENV"

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      # Source selects JDK 11 x64, but not a vendor/patch. Temurin is a supported
      # setup-java distribution compatible with Java 8 bytecode / JaCoCo 0.8.2.
      # Do not enable setup-java caching: the explicit source cache is above.
      - name: Select JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false

      # Maven@4 defaults to the agent's Maven installation. No Maven version was
      # pinned by the source. POM-owned JaCoCo is not injected a second time.
      - name: Build, test and package
        id: maven
        env:
          # Do not let setup-java add --no-transfer-progress to source arguments.
          MAVEN_ARGS: ''
        run: mvn -B -f pom.xml clean verify

      # Maven@4 publishes available JUnit results even when Maven fails.
      # Collection never clears that failure and missing files add no new gate.
      - name: Collect JUnit reports (dashboard parity gap)
        if: ${{ !cancelled() && (steps.maven.outcome == 'success' || steps.maven.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: '**/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

      # succeededOrFailed() maps to a non-cancellation status check here.
      # failIfCoverageEmpty=false: missing coverage is deliberately non-fatal.
      # No coverage percentage threshold exists in the source.
      - name: Collect JaCoCo reports (dashboard parity gap)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: warn

      # Direct upload replaces CopyFiles@2 staging without changing WAR contents:
      # target/*.war only (not recursive), archive root contains the WAR basenames.
      # CopyFiles@2 succeeds on no matches; do not introduce a missing-WAR gate.
      # The producer is this build/run; source defines no downstream consumer.
      # Retention is left to GitHub settings, not asserted equal to ADO retention.
      - name: Publish WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: target/*.war
          if-no-files-found: warn
