# Source: azure-pipelines.yml
# Generated by ado-to-github-cli; needs review before use.
name: Maven CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# ADO pr.autoCancel defaults to true. Never cancel push or manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, Test and Package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # ADO UI fetch depth/tags/clean settings were not supplied.
          fetch-depth: 1
          fetch-tags: false
          clean: true

      - name: Set Maven workspace paths
        run: |
          printf 'MAVEN_CACHE_FOLDER=%s/.m2/repository\n' "$RUNNER_WORKSPACE" >> "$GITHUB_ENV"
          printf 'MAVEN_OPTS=-Dmaven.repo.local=%s/.m2/repository\n' "$RUNNER_WORKSPACE" >> "$GITHUB_ENV"

      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ${{ env.MAVEN_CACHE_FOLDER }}
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          architecture: x64
          overwrite-settings: false
          # Do not inject the action's default -ntp into Maven arguments.
          show-download-progress: true

      - name: Build, test and package
        id: maven
        # MAVEN_OPTS explicitly replaces, not extends, Maven@4's -Xmx1024m default.
        # POM-owned JaCoCo 0.8.2; no task instrumentation or extra analysis goals.
        run: mvn -f pom.xml -B clean verify

      - name: Stage WAR file
        # SA-01 reporting below must not add a packaging dependency.
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-staging"
          shopt -s nullglob
          for war in target/*.war; do
            destination="$RUNNER_TEMP/artifact-staging/$(basename "$war")"
            if [[ ! -e "$destination" ]]; then
              cp -- "$war" "$destination"
            fi
          done

      - name: Publish WAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: drop
          path: ${{ runner.temp }}/artifact-staging/
          # CopyFiles@2 succeeds with no matches; do not add a missing-WAR gate.
          if-no-files-found: warn

      # SA-01: replace ADO test/coverage dashboards with reports and a summary.
      # Collect after Maven failure, but never turn Maven failure into success.
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            **/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

      - name: Summarize tests and coverage
        if: ${{ !cancelled() }}
        # Inline standard-library adapter for SA-01; not execution-verified.
        # Only numeric totals and fixed text enter the summary, not report text.
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          lines = ["## Tests and coverage", "",
                   "Reports: `test-and-coverage-reports` artifact in this run.",
                   "Absent reports are permitted; inspect the Maven step result.", ""]
          totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
          # Maven@4 allows broken symbolic links during report discovery.
          reports = [report for report in glob.glob(
              "**/surefire-reports/TEST-*.xml", recursive=True)
              if Path(report).is_file()]
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else [
                  suite for suite in root.iter("testsuite")
                  if suite.find("testsuite") is None
              ]
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.get(key, "0"))
          if reports:
              lines.append("JUnit: " + ", ".join(
                  f"{key}={value}" for key, value in totals.items()))
          else:
              lines.append("JUnit: no matching reports found.")

          coverage = Path("target/site/jacoco/jacoco.xml")
          if coverage.is_file():
              root = ET.parse(coverage).getroot()
              lines.extend(["", "| JaCoCo counter | Covered | Missed | Total | Coverage |",
                            "| --- | ---: | ---: | ---: | ---: |"])
              for counter in root.findall("counter"):
                  kind = counter.get("type", "")
                  if kind not in ("INSTRUCTION", "BRANCH", "LINE", "COMPLEXITY", "METHOD", "CLASS"):
                      continue
                  covered = int(counter.get("covered", "0"))
                  missed = int(counter.get("missed", "0"))
                  total = covered + missed
                  percentage = f"{100 * covered / total:.2f}%" if total else "n/a"
                  lines.append(f"| {kind} | {covered} | {missed} | {total} | {percentage} |")
          else:
              lines.append("JaCoCo: no XML report found (failIfCoverageEmpty=false).")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(("\n".join(lines) + "\n")[:16384])
          PY
